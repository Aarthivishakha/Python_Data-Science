name: CI

on:
  push:
    branches: [PYTHON_3.14]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: ruff check datascience tests
      - run: pytest --cov=datascience --cov-branch tests

  analyze-compatible-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r tool-triggers/requirements.txt
      - run: coverage run -m unittest discover -s tests
      - run: bandit -r datascience
      - run: radon cc datascience -s -a
