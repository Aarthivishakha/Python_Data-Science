[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[project]
name = "python-data-science-pipeline"
version = "1.0.0"
description = "Reproducible Data Science and regression ML pipeline for Python 3.15"
requires-python = ">=3.15,<3.16"

[project.scripts]
data-science = "datascience.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["datascience"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
