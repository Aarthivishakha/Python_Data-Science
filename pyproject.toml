[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[project]
name = "python-data-science-pipeline"
version = "1.0.0"
description = "Reproducible CSV analysis and regression pipeline for Python 3.9"
requires-python = ">=3.9,<3.10"

[project.scripts]
data-science = "datascience.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["datascience"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
